# ローカル開発用の Supabase 設定
# 本番の設定はダッシュボードで管理する。ここに秘密情報を書かないこと。

project_id = "insight-match-app"

[api]
enabled = true
port = 54321
# private を絶対に含めないこと（AGENTS.md R-2 / ADR-0003 第1層）
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# アプリのディープリンク(AndroidManifest.xml / meta-oauth の APP_RETURN_URL と揃える)
additional_redirect_urls = ["insightmatch://sns-link"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# 差出人がひと目で分かるよう、件名と本文にアプリ名を入れる。
# 本番はダッシュボード管理のため、変更したら docs/manual_setup/supabase.md の
# 手順で同じ内容を Auth > Email Templates に貼り直すこと。
[auth.email.template.confirmation]
subject = "【SNS Insight Matcher】メールアドレスのご確認"
content_path = "./templates/confirmation.html"

[auth.email.template.recovery]
subject = "【SNS Insight Matcher】パスワード再設定のご案内"
content_path = "./templates/recovery.html"

[auth.email.template.email_change]
subject = "【SNS Insight Matcher】メールアドレス変更のご確認"
content_path = "./templates/email_change.html"

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"

# meta-oauth は Meta からのリダイレクト（JWT なしの GET）を受けるため、
# ゲートウェイの JWT 検証を無効にし、認可開始（POST）はコード内で JWT を検証する。
[functions.meta-oauth]
verify_jwt = false
