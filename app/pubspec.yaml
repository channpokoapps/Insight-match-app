name: insight_match
description: 店舗と投稿者をつなぐ SNS マッチングアプリ(SNS Insight Matcher)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状態管理
  flutter_riverpod: ^2.5.1

  # ルーティング
  go_router: ^14.2.0

  # バックエンド
  supabase_flutter: ^2.5.6

  # 郵便番号 → 住所の外部 API 呼び出し（core/address/postal_code_repository.dart）
  http: ^1.2.2

  # 認証（Google サインイン。Web / Android とも ID トークン方式で使う）
  google_sign_in: ^7.2.0
  # Web の GIS ボタン（renderButton）を直接使うため明示的に依存する。
  # GIS は自分が描画したボタン以外からの認証開始を認めていない。
  google_sign_in_web: ^1.1.3

  # UI
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  intl: ^0.20.2

  # デバイス機能
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.2

  # 通知・計測（Firebase は FCM / Analytics のみ。バックエンドは Supabase）
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  firebase_analytics: ^11.6.0

  # ログ
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
