name: Firebase のセットアップ
description: >-
  firebase-tools のインストールとサービスアカウントでの認証をまとめて行う。
  デプロイ系のワークフローが同じ前処理を必要とするため切り出した
  （Shift Navi の同名アクションの単一サイト版。このリポジトリの Hosting は
  デフォルトサイト 1 つなので .firebaserc の生成は不要で、--project 指定で足りる）。

# 秘密情報の扱いを 1 箇所に集約するのがこのアクションの目的でもある。
#
# ★ 呼び出し側の責務 ★
#   複合アクションは post ステップを持てないため、鍵ファイルの後始末は
#   呼び出し側が `if: always()` のステップで行うこと。
#
#     - name: 鍵の痕跡を消す
#       if: always()
#       run: rm -f "$RUNNER_TEMP/firebase_service_account.json"
#
#   $RUNNER_TEMP はジョブ終了時に破棄されるので二重の保険だが、
#   同一ジョブ内でアーティファクトを upload する場合に効いてくる。

inputs:
  service_account_json:
    description: サービスアカウントの鍵 JSON の全文（secrets.FIREBASE_SERVICE_ACCOUNT）
    required: true
  firebase_tools_version:
    description: >-
      firebase-tools のバージョン。固定しないとツール更新のたびに挙動が変わる。
      各ワークフローの FIREBASE_TOOLS_VERSION と揃えること。
    required: false
    default: '13.29.1'

runs:
  using: composite
  steps:
    # グローバルインストールでも npm のダウンロードキャッシュは効く。
    # バージョンをキーに含めるので、更新時は自動で別キャッシュになる。
    - name: npm のキャッシュを復元
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-firebase-tools-${{ runner.os }}-${{ inputs.firebase_tools_version }}

    - name: firebase-tools をインストール
      shell: bash
      run: npm install -g "firebase-tools@${{ inputs.firebase_tools_version }}"

    # 鍵は $GITHUB_WORKSPACE の外に置く。ワークスペース内に置くと
    # アーティファクトの upload や git add -A で漏れうるため。
    - name: サービスアカウントで認証する
      shell: bash
      env:
        SERVICE_ACCOUNT_JSON: ${{ inputs.service_account_json }}
      run: |
        set -euo pipefail
        key_path="$RUNNER_TEMP/firebase_service_account.json"
        printf '%s' "$SERVICE_ACCOUNT_JSON" > "$key_path"
        chmod 600 "$key_path"
        # 中身が JSON として妥当かだけ確認する（値はログに出さない）。
        if ! jq -e 'has("client_email") and has("private_key")' "$key_path" > /dev/null; then
          echo "::error::FIREBASE_SERVICE_ACCOUNT が正しいサービスアカウント鍵 JSON ではありません。"
          exit 1
        fi
        echo "GOOGLE_APPLICATION_CREDENTIALS=$key_path" >> "$GITHUB_ENV"
        echo "サービスアカウント $(jq -r .client_email "$key_path") で認証します。"
