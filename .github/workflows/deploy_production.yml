name: Deploy Production

# main にマージされた変更を本番（live）へ自動デプロイする。
#
# トリガーは push ではなく workflow_run。ci.yml が main で成功したあとに、
# CI が検証したのと同じコミットをチェックアウトしてデプロイする。これにより:
#   - CI（flutter analyze/test・supabase test db・deno task check）が
#     失敗したコミットは本番に出ない
#   - デプロイ前にテストを再実行する必要がない（同じ SHA で検証済みのため）
#
# 自動デプロイの対象は Firebase Hosting（Web お試し版）だけ。
# Supabase（マイグレーション・Edge Functions）は本番 DB を書き換える操作で、
# R-1〜R-5（インサイト非開示）に直結するため自動化していない。
# supabase/ に変更があるマージでは、手動反映の手順を PR にコメントで案内する
# （自動化の是非は docs/open_issues.md OI-45）。
#
# concurrency は固定グループ + cancel-in-progress: false。デプロイを途中で
# 打ち切ると中途半端な状態になるため、連続マージは直列に処理する。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # 変更検出を無視してデプロイし直したいとき用（障害復旧など）。
  workflow_dispatch:
    inputs:
      deploy_all:
        description: '変更検出を無視して Hosting をデプロイする'
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write   # マージ元 PR へ結果をコメントするため

env:
  FIREBASE_TOOLS_VERSION: '13.29.1'

jobs:
  deploy:
    name: 本番へのデプロイ
    # workflow_run では CI の成否に関わらず起動するため、成功時だけ通す。
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      app: ${{ steps.detect.outputs.app }}
      supabase: ${{ steps.detect.outputs.supabase }}
      sha: ${{ steps.detect.outputs.sha }}
      configured: ${{ steps.secrets.outputs.configured }}
      hosting_result: ${{ steps.deploy_hosting.outcome }}
    steps:
      # CI が検証した SHA をそのまま使う。workflow_run 起動時に main の最新を
      # チェックアウトすると、CI が通ったコミットとズレる可能性がある。
      # fetch-depth: 2 は変更検出（第一親との diff）に必要。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      # 変更検出は paths-filter ではなく素の git diff で行う。workflow_run
      # イベントでは paths-filter に比較元を正しく渡すのが難しいため。
      # マージコミットなら第一親との差分 = その PR の変更内容になる。
      - name: 変更されたコンポーネントを検出
        id: detect
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.deploy_all }}" = "true" ]; then
            echo "deploy_all が指定されたため Hosting をデプロイします。"
            files=""
            changed_all=true
          elif ! git rev-parse HEAD^ > /dev/null 2>&1; then
            echo "親コミットが見つからないため安全側に倒して全対象を変更ありとみなします。"
            files=""
            changed_all=true
          else
            changed_all=false
            files="$(git diff --name-only HEAD^ HEAD)"
            echo "変更ファイル:"
            printf '%s\n' "$files"
          fi

          check() {
            local name="$1"; shift
            local hit=false
            if [ "$changed_all" = "true" ]; then
              hit=true
            else
              for pattern in "$@"; do
                if printf '%s\n' "$files" | grep -q "^${pattern}"; then
                  hit=true
                  break
                fi
              done
            fi
            echo "${name}=${hit}" >> "$GITHUB_OUTPUT"
            echo "検出 ${name}: ${hit}"
          }

          check app      'app/' 'firebase.json'
          check supabase 'supabase/'

      # Secrets 未設定ならジョブを赤くせずスキップする（deploy_preview.yml と同じ方針）。
      - name: デプロイに必要な Secrets の有無を確認
        id: secrets
        env:
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
          HAS_ENV: ${{ secrets.FLUTTER_ENV_PROD != '' }}
          HAS_WEB: ${{ secrets.FLUTTER_WEB_FIREBASE_CONFIG != '' }}
          HAS_PROJECT: ${{ vars.FIREBASE_PROJECT_ID != '' }}
        run: |
          if [ "$HAS_SA" = "true" ] && [ "$HAS_ENV" = "true" ] && [ "$HAS_WEB" = "true" ] && [ "$HAS_PROJECT" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::デプロイ用の Secrets / Variables が未設定です（docs/manual_setup/github_automation.md §2〜3）。本番反映をスキップします。"
          fi

      - name: Flutter をセットアップ
        if: steps.detect.outputs.app == 'true' && steps.secrets.outputs.configured == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub パッケージをキャッシュ
        if: steps.detect.outputs.app == 'true' && steps.secrets.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: 接続設定を復元する
        if: steps.detect.outputs.app == 'true' && steps.secrets.outputs.configured == 'true'
        env:
          ENV_PROD: ${{ secrets.FLUTTER_ENV_PROD }}
          WEB_FIREBASE_CONFIG: ${{ secrets.FLUTTER_WEB_FIREBASE_CONFIG }}
        run: |
          set -euo pipefail
          printf '%s' "$ENV_PROD" > env/prod.json
          printf '%s' "$WEB_FIREBASE_CONFIG" > env/web_firebase_config.json

      - name: Flutter Web をビルド
        if: steps.detect.outputs.app == 'true' && steps.secrets.outputs.configured == 'true'
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define-from-file=../env/prod.json \
            --dart-define-from-file=../env/web_firebase_config.json

      - name: Firebase をセットアップ
        if: steps.detect.outputs.app == 'true' && steps.secrets.outputs.configured == 'true'
        uses: ./.github/actions/setup_firebase
        with:
          service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          firebase_tools_version: ${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Hosting（live）へデプロイ
        id: deploy_hosting
        if: steps.detect.outputs.app == 'true' && steps.secrets.outputs.configured == 'true'
        run: |
          firebase deploy --only hosting \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive

      # Supabase は自動デプロイしない（ファイル冒頭のコメント参照）。
      - name: Supabase 変更の警告
        if: steps.detect.outputs.supabase == 'true'
        run: |
          echo "::warning::supabase/ に変更があります。マイグレーション・Edge Functions は自動デプロイの対象外です。docs/poc_guide.md §3 の手順で手動反映してください。"
          {
            echo "## ⚠️ Supabase の手動反映が必要です"
            echo ""
            echo '`supabase/` に変更がありますが、本番の Supabase への反映は自動化していません。'
            echo 'PC で以下を実行してください（詳細: `docs/poc_guide.md` §3）。'
            echo ""
            echo '```bash'
            echo 'supabase db push --linked        # マイグレーションの適用'
            echo 'supabase functions deploy        # Edge Functions の反映'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 鍵の痕跡を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase_service_account.json" env/prod.json env/web_firebase_config.json

  # ------------------------------------------------------------------
  # 結果をマージ元 PR へコメントする。スマホからは PR の画面だけ見ていれば
  # 「マージした変更が本番に出たか」まで分かる。
  # ------------------------------------------------------------------
  notify:
    name: 確認リンクの投稿
    needs: deploy
    if: always() && !cancelled() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: デプロイ結果をコメント
        uses: actions/github-script@v7
        env:
          SHA: ${{ needs.deploy.outputs.sha }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          HOSTING_RESULT: ${{ needs.deploy.outputs.hosting_result }}
          APP_CHANGED: ${{ needs.deploy.outputs.app }}
          SUPABASE_CHANGED: ${{ needs.deploy.outputs.supabase }}
          CONFIGURED: ${{ needs.deploy.outputs.configured }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        with:
          script: |
            const marker = '<!-- insight-match-live -->';
            const liveUrl = process.env.PROJECT_ID
              ? `https://${process.env.PROJECT_ID}.web.app`
              : '(FIREBASE_PROJECT_ID 未設定)';

            let hostingStatus;
            if (process.env.APP_CHANGED !== 'true') {
              hostingStatus = '⏭️ 変更なし';
            } else if (process.env.CONFIGURED === 'false') {
              hostingStatus = '⚙️ Secrets 未設定のためスキップ（docs/manual_setup/github_automation.md §2〜3）';
            } else if (process.env.HOSTING_RESULT === 'success') {
              hostingStatus = '✅ 反映済み';
            } else {
              hostingStatus = '❌ 失敗（Actions のログを確認）';
            }

            const lines = [
              marker,
              '## 🚀 本番への反映結果',
              '',
              '| 対象 | 結果 | リンク |',
              '| --- | --- | --- |',
              `| Web お試し版 | ${hostingStatus} | ${liveUrl} |`,
            ];
            if (process.env.SUPABASE_CHANGED === 'true') {
              lines.push('');
              lines.push('- ⚠️ `supabase/` に変更があります。マイグレーション・Edge Functions は**手動反映**が必要です（`docs/poc_guide.md` §3）。反映するまで、この PR のサーバー側の変更は本番に出ていません。');
            }
            lines.push('');
            lines.push(`<sub>commit ${(process.env.SHA || '').slice(0, 7)} / run ${context.runId}</sub>`);
            const body = lines.join('\n');

            // Step Summary には常に出す（直接 push などで PR が無い場合の受け皿）。
            await core.summary.addRaw(body).write();

            // マージ元 PR を SHA から逆引きしてコメントする。
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: process.env.SHA,
            });
            const pr = prs.find(p => p.state === 'closed' && p.merged_at) || prs[0];
            if (!pr) {
              core.info('マージ元 PR が見つからないためコメントをスキップします。');
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
