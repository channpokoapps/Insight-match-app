name: CI

on:
  push:
    # claude/**: GITHUB_TOKEN が作成した PR では pull_request イベントの
    # ワークフローが発火しない(GitHub の再帰防止仕様)ため、push 時点で CI を回す
    branches: [main, develop, 'claude/**']
  pull_request:

env:
  # Supabase CLI は版を固定する。`latest` にすると setup-cli が
  # api.github.com/repos/supabase/cli/releases/latest を認証なしで叩き、
  # runner の IP 単位 60回/時のレート制限に当たって取得が落ちることがある
  # （実際に発生済み）。版を書けばこの API 呼び出し自体が起きない。
  # 更新するときは supabase_migrate.yml と揃えること。
  SUPABASE_CLI_VERSION: 2.112.0

jobs:
  flutter:
    name: Flutter analyze / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  supabase:
    name: Supabase migrations / pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # マイグレーション適用と権限・RLS・k-匿名性テスト（AGENTS.md §5: これが落ちたらマージ禁止）
      - run: supabase db start
      - run: supabase test db

  edge-functions:
    name: Edge Functions typecheck / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task test
