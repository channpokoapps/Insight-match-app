name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  flutter:
    name: Flutter analyze / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  supabase:
    name: Supabase migrations / pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # マイグレーション適用と権限・RLS・k-匿名性テスト（AGENTS.md §5: これが落ちたらマージ禁止）
      - run: supabase db start
      - run: supabase test db

  edge-functions:
    name: Edge Functions typecheck / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task test
