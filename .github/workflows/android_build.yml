name: Android Build

# Android アプリの APK をビルドし、Firebase App Distribution でテスター
# （自分のスマホ）へ配布する。配布されるとスマホの App Tester アプリに
# 通知が届き、タップでインストールできる。
#
# APK ビルドは 1 回 8〜15 分と高コストなので、毎 PR push では走らせない:
#   - PR に「/apk」とコメントしたとき（その PR の内容をビルド）
#   - main に app/ の変更がマージされたとき
#   - 手動（workflow_dispatch）
#
# 署名は upload keystore（Secrets から復元）で行う。署名が毎回同じであることが
# 重要で、変わるとスマホ側でアンインストールしないと更新できなくなる。
# 鍵の作成と Secrets への登録は docs/manual_setup/github_automation.md §5。
on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'ビルドする ref（省略時は main）'
        required: false
        default: ''
      distribute:
        description: 'App Distribution へ配布する'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write   # 受理リアクションと結果コメントに必要
  issues: write

env:
  FIREBASE_TOOLS_VERSION: '13.29.1'

jobs:
  build:
    name: APK のビルドと配布
    # issue_comment は Issue と PR の両方で発火するため、PR のコメントかつ
    # 本文が /apk で始まるときだけ通す。
    #
    # author_association の絞り込みは省略してはならない。issue_comment 経路は
    # main のワークフロー定義と secrets で動くが、チェックアウトするのは
    # PR ブランチのコードなので、公開リポジトリでは外部の第三者が /apk と
    # コメントするだけで任意コードに secrets を触らせてしまう経路になりうる。
    if: >-
      github.event_name != 'issue_comment'
      || (
        github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/apk')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    # 同じ PR / ref で連続実行されたときに古いビルドを打ち切る。
    # claude.yml と同じ理由でジョブレベルに置く。
    concurrency:
      group: android-${{ github.event.issue.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 受理したことをスマホからも分かるようにリアクションで返す。
      - name: コメントに 👀 を付ける
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content='eyes' > /dev/null

      # ビルド対象の SHA を決める。/apk コメントのときは PR の head。
      - name: ビルド対象を解決する
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            ref="$(gh pr view "${{ github.event.issue.number }}" \
              --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)"
            pr_number="${{ github.event.issue.number }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ref="${{ inputs.ref }}"
            [ -z "$ref" ] && ref="main"
            pr_number=""
          else
            ref="${{ github.sha }}"
            pr_number=""
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "ビルド対象: ${ref}（PR: ${pr_number:-なし}）"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: JDK 17 をセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 開発機向けのヒープ設定が runner（2 コア / 7 GB RAM）で大きすぎる場合に
      # 備え、~/.gradle 側で上書きする（プロジェクトの gradle.properties より優先）。
      - name: Gradle のヒープを CI のメモリに合わせる
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.daemon=false
          org.gradle.parallel=false
          EOF

      - name: Gradle をセットアップ
        uses: gradle/actions/setup-gradle@v4

      - name: Flutter をセットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub パッケージをキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # 署名鍵・Firebase 設定・接続情報を Secrets から復元する。
      #   - キーストアはワークスペース外（$RUNNER_TEMP）に置く。ワークスペース内に
      #     置くとアーティファクトの upload 等で漏れる経路ができるため。
      #   - key.properties は Gradle が rootProject.file() で読む都合で
      #     app/android/ 直下が必須。gitignore 済みなので追跡はされない。
      - name: 署名鍵と接続設定を復元する
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ENV_PROD: ${{ secrets.FLUTTER_ENV_PROD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 GOOGLE_SERVICES_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS ENV_PROD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret が未設定です: ${v}（docs/manual_setup/github_automation.md §3・§5）"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload_keystore.jks"
          chmod 600 "$RUNNER_TEMP/upload_keystore.jks"

          cat > app/android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=${RUNNER_TEMP}/upload_keystore.jks
          EOF
          chmod 600 app/android/key.properties

          printf '%s' "$GOOGLE_SERVICES_BASE64" | base64 -d > app/android/app/google-services.json
          printf '%s' "$ENV_PROD" > env/prod.json

      # versionCode を run 番号でずらし、App Distribution 上でビルドを
      # 識別できるようにする（同じ番号だとどれが最新か分からなくなる）。
      - name: APK をビルド
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release \
            --build-number "${{ github.run_number }}" \
            --dart-define-from-file=../env/prod.json

      # keytool -jarfile は APK Signature Scheme v2/v3 のみで署名された APK を
      # 読めない（minSdk 24 以降の既定）ため、apksigner を使う。
      - name: 署名を検証
        run: |
          set -euo pipefail
          apksigner="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          cert="$("$apksigner" verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk | head -3)"
          echo "$cert"
          if printf '%s' "$cert" | grep -q 'Android Debug'; then
            echo "::error::APK が debug 鍵で署名されています。key.properties の復元に失敗しています。"
            exit 1
          fi

      - name: firebase-tools のキャッシュを復元
        if: github.event_name != 'workflow_dispatch' || inputs.distribute
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-firebase-tools-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}

      - name: App Distribution へ配布
        id: distribute
        if: github.event_name != 'workflow_dispatch' || inputs.distribute
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          npm install -g "firebase-tools@${FIREBASE_TOOLS_VERSION}"

          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase_service_account.json"
          chmod 600 "$RUNNER_TEMP/firebase_service_account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase_service_account.json"

          # Android の App ID は google-services.json から導出する（Secrets を
          # 1 つ減らすため）。vars.FIREBASE_ANDROID_APP_ID があればそちらを優先。
          app_id="${{ vars.FIREBASE_ANDROID_APP_ID }}"
          if [ -z "$app_id" ]; then
            app_id="$(jq -r '.client[0].client_info.mobilesdk_app_id' app/android/app/google-services.json)"
          fi
          echo "app_id=${app_id}" >> "$GITHUB_OUTPUT"

          # --groups に渡すのはグループの「エイリアス」（表示名ではない）。
          # 未設定なら既定の testers を使う（docs/manual_setup/github_automation.md §5）。
          groups="${{ vars.APP_DISTRIBUTION_GROUPS }}"
          groups="${groups:-testers}"

          # リリースノートはコミットの件名 + 参照情報。スマホの App Tester に表示される。
          {
            git log -1 --pretty='%s'
            echo ""
            echo "commit $(git rev-parse --short HEAD) / build #${{ github.run_number }}"
          } > "$RUNNER_TEMP/release_notes.txt"

          firebase appdistribution:distribute \
            app/build/app/outputs/flutter-apk/app-release.apk \
            --app "$app_id" \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" \
            --groups "$groups" \
            --release-notes-file "$RUNNER_TEMP/release_notes.txt"

      - name: 鍵の痕跡を消す
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/upload_keystore.jks" \
                "$RUNNER_TEMP/firebase_service_account.json" \
                app/android/key.properties \
                app/android/app/google-services.json \
                env/prod.json

      # /apk コメント経由のときは PR に結果を返す。インストールリンクは
      # App Distribution の安定 URL を使う（distribute コマンドの出力から
      # リリース個別 URL を取る方法は firebase-tools のバージョンに依存して
      # 壊れやすいため採らない）。
      - name: 結果を PR にコメント
        if: always() && steps.target.outputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          BUILD_OK: ${{ steps.distribute.outcome }}
          APP_ID: ${{ steps.distribute.outputs.app_id }}
        with:
          script: |
            const ok = process.env.BUILD_OK === 'success';
            const body = ok
              ? [
                  '## 📦 APK を配布しました',
                  '',
                  `スマホの **App Tester** アプリに通知が届いています。届かない場合は`,
                  `https://appdistribution.firebase.google.com/testerapps/${process.env.APP_ID} を開いてください。`,
                  '',
                  `<sub>build #${context.runNumber} / run ${context.runId}</sub>`,
                ].join('\n')
              : [
                  '## ❌ APK のビルドまたは配布に失敗しました',
                  '',
                  `[実行ログ](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) を確認してください。`,
                  'Secrets 未設定が原因の場合は `docs/manual_setup/github_automation.md` §5 を参照してください。',
                ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });
