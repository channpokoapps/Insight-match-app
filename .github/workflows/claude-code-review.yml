name: Claude Code Review

# PR が出揃った時点で Claude に自動レビューさせる。
#
# synchronize（PR への push）は意図的に外している。Claude が実装 → CI 失敗 →
# 修正 push という往復のたびにレビューが走り直し、1 回 3〜10 分の無料枠と
# トークンを二重に消費するため。PR の途中でもう一度見てほしいときは
# コメントで「@claude レビューして」と書けば claude.yml が対応する。
on:
  pull_request:
    types: [opened, ready_for_review]

# 同じ PR で連続して起動したら古い実行を打ち切り、無料枠を無駄遣いしない。
# 他のワークフローと揃えた設定。
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: PR の自動レビュー
    # 公開リポジトリのため fork からの PR では起動しない。secrets が渡らず
    # 失敗するだけでなく、第三者の PR で利用枠を消費させないための guard。
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # 暴走したジョブが無料枠を食い潰さないよう上限を設ける。
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write  # レビュー結果のコメント・インラインコメント投稿に必要
      issues: read
      id-token: write   # OIDC トークンの取得に必要

    steps:
      # 差分を読むだけなので履歴は不要。
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude によるコードレビューを実行
        id: claude-review
        # 自動レビューは「補助」であり、マージ・デプロイの必須条件ではない
        # （必須の品質ゲートは ci.yml のテスト。AGENTS.md §5）。
        # Claude の利用枠切れ（Pro / Max の usage limit）などでレビューが実行
        # できないとき、ここが赤 × になると poc_guide.md §2-⑤ の
        # 「チェックが全部緑か」に引っかかり、マージ＝デプロイが止まってしまう。
        # そのため失敗してもジョブは緑のまま通し、下のステップがワーニングと
        # PR コメントで「レビューは実行できなかった」ことを知らせる。
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # このリポジトリの標準フローでは auto-pr.yml が GITHUB_TOKEN で PR を
          # 自動作成するため、pull_request イベントのアクターが github-actions[bot]
          # になる。claude-code-action は allowed_bots に登録のない bot 起動を
          # 拒否する仕様のため、これがないと自動作成 PR のレビューが必ず失敗する。
          allowed_bots: 'github-actions,github-actions[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment を付けないとレビュー結果が Actions のログに出るだけで
          # PR には何も投稿されない（プラグインの仕様）。
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # プラグインのコマンド定義（frontmatter の allowed-tools）は
          # メイン会話にしか効かず、レビューの実体である並列サブエージェントの
          # gh 呼び出しが全て権限拒否されてジョブが失敗する（Shift Navi の
          # PR #2 で 37 回拒否された実績あり）。そのためプラグインが宣言している
          # ツール一覧と同じものを --allowedTools でセッション全体に許可する。
          claude_args: |
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"

      - name: レビューが実行できなかったことをワーニングで知らせる
        if: steps.claude-review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "::warning::自動レビューを実行できませんでした（Claude の利用枠切れが典型）。マージとデプロイは可能ですが、差分の確認は人間が行ってください。"
          {
            echo '## ⚠️ 自動レビューは実行できませんでした'
            echo ''
            echo 'Claude の利用枠切れなどが原因と考えられます。チェックは赤にせず、ワーニング止まりにしています。'
            echo '- **マージ（＝デプロイ）はこのままでも可能**です。必須の品質ゲートは CI のテストの方です。'
            echo '- 枠が回復したら、PR に `@claude レビューして` とコメントすると再実行できます。'
          } >> "$GITHUB_STEP_SUMMARY"
          # PR を見るだけの運用者（スマホ）にも伝わるようにコメントを残す。
          # コメント投稿に失敗しても、このジョブ自体は赤にしない（赤にすると
          # ワーニング化の目的が崩れるため）。
          body="$(cat <<'EOF'
          ⚠️ **自動レビューは実行できませんでした**（Claude の利用枠切れが典型）。

          - **マージ（＝デプロイ）はこのままでも可能**です。テスト（CI）が緑であることは別途確認してください。
          - レビューが無いぶん、**Files changed で差分を自分の目で確認**してからマージしてください。特に `supabase/` に変更がある場合はインサイト非開示ルール（R-1〜R-5）に関わるため慎重に。
          - 枠が回復したあとに、この PR へ `@claude レビューして` とコメントすると自動レビューを再実行できます。
          EOF
          )"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body" \
            || echo "::warning::PR へのコメント投稿に失敗しました。実行ログ: ${RUN_URL}"
