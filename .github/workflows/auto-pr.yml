name: Auto PR

# claude/** ブランチが push されたら、main 向けの PR を自動作成する。
# エージェント側の実行環境は外部ネットワークが制限されている場合があるため、
# 「commit の生成」までをエージェントが行い、PR 作成は GitHub Actions
# (ネットワーク制限のない実行環境)側に任せる構成。
on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PR title/body from commits
        id: meta
        run: |
          git fetch origin main --depth=1
          TITLE=$(git log -1 --pretty=%s)
          BODY=$(git log origin/main..HEAD --pretty='- %s' | tac)
          {
            echo "title<<EOF"
            echo "$TITLE"
            echo "EOF"
            echo "body<<EOF"
            echo "$BODY"
            echo ""
            echo "_Auto-generated by .github/workflows/auto-pr.yml_"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 「open な PR があるか」で判定する。`gh pr view <branch>` はマージ済み・
          # クローズ済みの PR も拾うため、これを存在確認に使うと **マージ後に同じ
          # ブランチへ push しても PR が作られなくなる**（変更が行き場を失う）。
          existing="$(gh pr list --head "${{ github.ref_name }}" --base main \
            --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR #${existing} is already open for ${{ github.ref_name }}, skipping create."
          else
            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "${{ steps.meta.outputs.title }}" \
              --body "${{ steps.meta.outputs.body }}"
          fi
