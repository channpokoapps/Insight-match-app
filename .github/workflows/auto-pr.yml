name: Auto PR

# claude/** ブランチが push されたら、main 向けの PR を自動作成する。
# Cowork のサンドボックスは GitHub へのネットワークアクセスがブロックされているため、
# 「commit の自動生成」まではサンドボックス側で行い、push 後の PR 作成は
# GitHub Actions(ネットワーク制限のない実行環境)側に任せる構成。
on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PR title/body from commits
        id: meta
        run: |
          git fetch origin main --depth=1
          TITLE=$(git log -1 --pretty=%s)
          BODY=$(git log origin/main..HEAD --pretty='- %s' | tac)
          {
            echo "title<<EOF"
            echo "$TITLE"
            echo "EOF"
            echo "body<<EOF"
            echo "$BODY"
            echo ""
            echo "_Auto-generated by .github/workflows/auto-pr.yml_"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr view "${{ github.ref_name }}" --json url >/dev/null 2>&1; then
            echo "PR already exists for ${{ github.ref_name }}, skipping create."
          else
            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "${{ steps.meta.outputs.title }}" \
              --body "${{ steps.meta.outputs.body }}"
          fi
